# Headers the dashboard cannot set from a <meta> tag.
# Used by the `web` service in docker-compose; GitHub Pages serves the same
# files without these, which is why the app never depends on them for
# correctness — they are defence in depth on top of output encoding.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; form-action 'none'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The dashboard is three static files; nothing here should be cached hard
    # enough to survive a redeploy.
    location ~* \.(css|js)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }
}
