name: phishhawk

on:
  push:
    paths:
      - "phishhawk/**"
      - ".github/workflows/phishhawk.yml"
  pull_request:
    paths:
      - "phishhawk/**"
      - ".github/workflows/phishhawk.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: phishhawk

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: phishhawk/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests samples docs eval phishhawk
      - name: Unit tests
        run: pytest
      - name: Smoke-test the CLI on the sample corpus
        # Exit code 1 means "suspicious": expected here, since most samples are phish.
        run: |
          phishhawk scan samples/ --offline --quiet --no-color \
            --stix bundle.json --html report.html --csv iocs.csv || test $? -eq 1
          python -c "import json; assert json.load(open('bundle.json'))['type'] == 'bundle'"
          phishhawk doctor --no-color
          phishhawk techniques --json > /dev/null
          ./phishhawk --version
      - name: Evaluation report (synthetic corpus)
        run: python eval/run_eval.py --synthetic

  installer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phishhawk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install.sh into a scratch prefix, run it, uninstall it
        env:
          PHISHHAWK_HOME: ${{ runner.temp }}/phishhawk-home
          PHISHHAWK_BIN: ${{ runner.temp }}/phishhawk-bin
        run: |
          ./install.sh
          "$PHISHHAWK_BIN/phishhawk" scan samples/sample_benign.eml --offline --quiet
          ./install.sh --uninstall
          test ! -e "$PHISHHAWK_BIN/phishhawk"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t phishhawk .
      - name: Run offline in the container, as non-root, with no network
        run: |
          docker run --rm --network none -v "$PWD/samples:/mail:ro" phishhawk \
            sample_phish.eml --offline --quiet --no-color || test $? -eq 1
