name: phishing-ioc-extractor

on:
  push:
    paths:
      - "phishing-ioc-extractor/**"
      - ".github/workflows/phishing-ioc-extractor.yml"
  pull_request:
    paths:
      - "phishing-ioc-extractor/**"
      - ".github/workflows/phishing-ioc-extractor.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: phishing-ioc-extractor

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: phishing-ioc-extractor/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests samples docs phishing_ioc_extractor.py
      - name: Unit tests
        run: pytest
      - name: Smoke-test the CLI on the sample corpus
        # Exit code 1 means "suspicious": expected here, since most samples are phish.
        run: |
          phish-triage samples/ --offline --quiet --no-color \
            --stix bundle.json --html report.html --csv iocs.csv || test $? -eq 1
          python -c "import json; assert json.load(open('bundle.json'))['type'] == 'bundle'"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t phishtriage .
      - name: Run offline in the container, as non-root, with no network
        run: |
          docker run --rm --network none -v "$PWD/samples:/mail:ro" phishtriage \
            sample_phish.eml --offline --quiet --no-color || test $? -eq 1
